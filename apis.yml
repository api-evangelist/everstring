name: Everstring
description: >-
  EverString was a B2B predictive marketing and sales intelligence platform that
  used data science, machine learning, and a proprietary business data cloud to
  help go-to-market teams identify their best-fit accounts. Its capabilities
  included predictive lead and account scoring, account-based marketing
  segmentation, firmographic enrichment, similar-company discovery, ML-generated
  keywords, and industry classification, exposed to developers through an
  Enrichment API on developer.everstring.com secured with access-token
  authentication. Founded in 2012 and backed by investors including Lightspeed
  Venture Partners, EverString was acquired by ZoomInfo in November 2019 and its
  data and predictive capabilities were folded into the ZoomInfo platform; the
  everstring.com website now redirects to ZoomInfo Operations and the standalone
  developer portal has been largely decommissioned. This profile documents the
  historical API surface and current public footprint.
